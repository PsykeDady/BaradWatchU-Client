# Packaging inputs/ownership plan. Cargo.toml remains the only product version source.
[product]
name = "BaradWatchU Client"
binary = "baradwatchu-agent"
version_source = "../Cargo.toml#[workspace.package].version"
formats = ["linux-source", "arch-pacman", "debian-deb", "fedora-rpm", "windows-setup-exe", "macos-dmg"]

[linux]
binary_package_path = "/usr/bin/baradwatchu-agent"
binary_source_prefix_path = "/usr/local/bin/baradwatchu-agent"
web_assets_path = "/usr/share/baradwatchu-client/web"
config_path = "/etc/baradwatchu/client"
data_path = "/var/lib/baradwatchu/client"
custom_checks_path = "/var/lib/baradwatchu/client/custom-checks"
service_unit = "baradwatchu-agent.service"
service_status = "part of the system installation (install.sh system mode, Windows all-users setup); per-user mode has none; namespace-tested, not run under real systemd; packages: deferred"
package_artifact_status = "planned-not-built-or-tested"

[desktop]
viewer_is_independent = true
viewer_launcher_status = "deferred"
tray_binary = "baradwatchu-tray"
tray_menu_entry = "share/applications/baradwatchu-tray.desktop"
tray_runs_as = "user-session-process"
tray_autostart = "per-user, opt-in (XDG autostart / HKCU Run / LaunchAgent)"
tray_platform_status = { linux = "verified-kde-plasma-6-wayland", windows = "compile-checked-only", macos = "compile-checked-only" }

[windows]
artifact = "setup.exe"
service = "Windows Service"
administrator_authorization = true
authenticode_signing_required = true
status = "plan-only"

[macos]
artifact = "dmg"
service = "launchd LaunchDaemon"
administrator_authorization = true
developer_id_signing_and_notarization_required = true
status = "plan-only"

[source_installer]
script = "../install.sh"
manifest = "share/baradwatchu-source/baradwatchu-agent.manifest"
manifest_hashes_payload = true
preserve_config_identity_audit_and_custom_checks = true
user_local_is_development_only = true
