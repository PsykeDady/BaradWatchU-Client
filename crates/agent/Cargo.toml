[package]
name = "baradwatchu-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
baradwatchu-messages = { path = "../messages" }
getrandom = "0.3"
flate2 = "1.1.11"
png = "0.18.1"
# Local identity (Milestone 1): audited Ed25519 implementation, no custom cryptography.
ed25519-dalek = { version = "2.1.1", default-features = false, features = ["std", "zeroize", "fast"] }
base64 = "0.22.1"
zeroize = "1.8"
# Milestone 2 remote channel: TLS 1.3 with mutual authentication by RFC 7250 raw public
# keys (the Ed25519 identity keys themselves; no X.509 chain). ring backend, no C toolchain
# beyond what ring needs.
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Job Objects: a tool and every process it starts are ended together (no process groups).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Services", "Win32_System_Threading"] }

