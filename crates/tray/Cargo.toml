[package]
name = "baradwatchu-tray"
description = "BaradWatchU Client tray companion: tray icon, native notifications, consent window"
version.workspace = true
edition.workspace = true
license.workspace = true
# tray-icon 0.26 needs 1.90, rfd 0.18 (Windows/macOS) needs 1.92.
rust-version = "1.92"

[dependencies]
serde.workspace = true
serde_json.workspace = true
baradwatchu-messages = { path = "../messages" }
# StatusNotifierItem over D-Bus on Linux (no GTK/AppIndicator libraries); native on Windows/macOS.
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
notify-rust = "4.18"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
# Windows and macOS need a native event loop on the main thread for the tray icon.
tao = "0.37"
rfd = { version = "0.18", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
# Already used by notify-rust; used directly for the consent toast with Accept/Reject buttons.
tauri-winrt-notification = "0.8"
